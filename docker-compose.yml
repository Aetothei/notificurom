services:
  notificurom:
    build: .
    container_name: notificurom
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - APP_URL=${APP_URL:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - ALLOWED_GITHUB_USERS=${ALLOWED_GITHUB_USERS:-}
      - GITHUB_OAUTH_SCOPES=${GITHUB_OAUTH_SCOPES:-}
