---
- name: Provision Notificurom Container on Incus host
  hosts: incus_hosts
  become: true
  roles:
    - role: redactum.core.incus_container
      vars:
        container_name: "notificurom"
        container_cpu_limit: "2"
        container_mem_limit: "3GiB"
        container_profiles: ["default"]
        container_nesting: "true"

- name: Configure and Deploy Notificurom Application
  hosts: notificurom
  vars:
    notificurom_port: 3000
    notificurom_app_dir: "/opt/notificurom"
  tasks:
    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - tar
        state: present
        cache_valid_time: 3600

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ notificurom_app_dir }}"
        state: directory
        mode: "0755"

    - name: Create tarball of application on runner
      community.general.archive:
        path:
          - "{{ playbook_dir }}/src"
          - "{{ playbook_dir }}/server"
          - "{{ playbook_dir }}/public"
          - "{{ playbook_dir }}/index.html"
          - "{{ playbook_dir }}/vite.config.ts"
          - "{{ playbook_dir }}/components.json"
          - "{{ playbook_dir }}/package.json"
          - "{{ playbook_dir }}/package-lock.json"
          - "{{ playbook_dir }}/drizzle.config.ts"
          - "{{ playbook_dir }}/drizzle"
          - "{{ playbook_dir }}/Dockerfile"
          - "{{ playbook_dir }}/.dockerignore"
          - "{{ playbook_dir }}/docker-compose.yml"
          - "{{ playbook_dir }}/tsconfig.json"
          - "{{ playbook_dir }}/eslint.config.mjs"
        dest: "/tmp/notificurom_app.tar.gz"
        format: gz
      delegate_to: localhost

    - name: Clean up obsolete Next.js files in container before extract
      ansible.builtin.file:
        path: "{{ notificurom_app_dir }}/{{ item }}"
        state: absent
      loop:
        - postcss.config.mjs
        - next.config.ts
        - .next

    - name: Extract application files into container
      ansible.builtin.unarchive:
        src: "/tmp/notificurom_app.tar.gz"
        dest: "{{ notificurom_app_dir }}"

    - name: Ensure data directory exists with ownership for nextjs user
      ansible.builtin.file:
        path: "{{ notificurom_app_dir }}/data"
        state: directory
        owner: "1001"
        group: "1001"
        mode: "0775"

    - name: Configure .env for Docker Compose
      ansible.builtin.copy:
        dest: "{{ notificurom_app_dir }}/.env"
        content: |
          NODE_ENV=production
          APP_URL=https://{{ lookup('ansible.builtin.env', 'APP_DOMAIN') }}
          GITHUB_CLIENT_ID={{ lookup('ansible.builtin.env', 'GH_CLIENT_ID') | default('', true) }}
          GITHUB_CLIENT_SECRET={{ lookup('ansible.builtin.env', 'GH_CLIENT_SECRET') | default('', true) }}
          SESSION_SECRET={{ lookup('ansible.builtin.env', 'SESSION_SECRET') | default('', true) }}
          ALLOWED_GITHUB_USERS={{ lookup('ansible.builtin.env', 'ALLOWED_GITHUB_USERS') | default('', true) }}
          GITHUB_OAUTH_SCOPES={{ lookup('ansible.builtin.env', 'GITHUB_OAUTH_SCOPES') | default('', true) }}
        mode: "0600"

    - name: Build and deploy Notificurom container via Docker Compose
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml up -d --build
        chdir: "{{ notificurom_app_dir }}"
      changed_when: true

- name: Register Notificurom route in Caddy gateway
  hosts: caddy
  roles:
    - role: redactum.core.caddy_route
      vars:
        service_name: notificurom
        service_domain: "{{ lookup('ansible.builtin.env', 'APP_DOMAIN') }}"
        service_upstream: "notificurom.incus:3000"
        service_route_scope: "external"
